<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TODA POS — Bán hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7aa653; --accent-ink:#fff;
  --r:14px; --r-sm:10px;
  --sb-w:262px; --sb-cw:78px; --cart-w:384px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;
}
html[data-theme="dark"]{
  --bg:oklch(0.175 0.012 250);
  --sidebar:oklch(0.135 0.013 250);
  --panel:oklch(0.155 0.012 250);
  --card:oklch(0.215 0.012 250);
  --card-h:oklch(0.255 0.013 250);
  --field:oklch(0.205 0.012 250);
  --border:oklch(0.30 0.012 250);
  --border-soft:oklch(0.255 0.012 250);
  --text:oklch(0.955 0.008 95);
  --text-dim:oklch(0.66 0.012 250);
  --text-faint:oklch(0.45 0.012 250);
  --shadow:0 12px 34px -12px rgba(0,0,0,.55);
}
html[data-theme="light"]{
  --bg:oklch(0.955 0.008 95);
  --sidebar:oklch(0.99 0.006 95);
  --panel:oklch(0.99 0.006 95);
  --card:oklch(0.995 0.003 95);
  --card-h:oklch(0.975 0.008 95);
  --field:oklch(0.975 0.007 95);
  --border:oklch(0.885 0.01 95);
  --border-soft:oklch(0.92 0.008 95);
  --text:oklch(0.26 0.02 255);
  --text-dim:oklch(0.5 0.016 255);
  --text-faint:oklch(0.72 0.012 255);
  --shadow:0 12px 30px -14px rgba(40,30,10,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
input,select{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint)}
.tnum{font-variant-numeric:tabular-nums}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{width:var(--sb-w);flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;transition:width .22s ease;position:relative}
.sidebar.collapsed{width:var(--sb-cw)}
.sb-head{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;position:relative}
.sb-logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.sb-brand{min-width:0}
.sb-title{font-weight:800;font-size:16px;letter-spacing:.04em}
.sb-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px}
.sb-collapse{position:absolute;right:-12px;top:24px;width:24px;height:24px;border-radius:8px;background:var(--card);
  border:1px solid var(--border);display:grid;place-items:center;color:var(--text-dim);z-index:5}
.sb-collapse:hover{color:var(--text);border-color:var(--accent)}
.collapsed .sb-head{justify-content:center;padding:18px 0 16px}

.branch{display:flex;align-items:center;gap:9px;margin:2px 14px 10px;padding:10px 12px;border-radius:var(--r-sm);
  background:var(--card);border:1px solid var(--border-soft);color:var(--text-dim);font-size:13px;font-weight:500}
.collapsed .branch{justify-content:center;margin:2px 14px 10px}

.nav{flex:1;overflow-y:auto;padding:4px 14px}
.nav-group{margin-bottom:14px}
.nav-glabel{font-size:10.5px;letter-spacing:.12em;color:var(--text-faint);font-weight:700;padding:6px 10px 7px}
.nav-item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:var(--r-sm);
  color:var(--text-dim);font-size:14px;font-weight:500;position:relative;transition:.14s}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item.active .nav-ico{color:var(--accent)}
.nav-ico{display:grid;place-items:center;flex-shrink:0}
.nav-text{white-space:nowrap;overflow:hidden}
.nav-badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;
  min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.collapsed .nav-item{justify-content:center;padding:11px 0}
.collapsed .nav-glabel{text-align:center;padding:6px 0 7px;font-size:0}
.collapsed .nav-glabel::after{content:"\2022\2022\2022";font-size:8px;letter-spacing:1px}

.sb-foot{border-top:1px solid var(--border-soft);padding:14px;display:flex;align-items:center;gap:10px}
.sb-user{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#000));
  color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.avatar.sm{width:30px;height:30px;border-radius:9px;font-size:12px}
.sb-userinfo{min-width:0}
.u-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-role{font-size:11.5px;color:var(--text-dim)}
.sb-logout{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-dim);border:1px solid var(--border-soft)}
.sb-logout:hover{color:#e06a52;border-color:#e06a52}
.collapsed .sb-foot{justify-content:center}

/* ---------- Center / topbar ---------- */
.center{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;flex-shrink:0;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;
  gap:12px;padding:0 22px;background:var(--bg)}
.tb-spacer{flex:1}
.lang-seg{display:flex;background:var(--card);border:1px solid var(--border-soft);border-radius:9px;padding:3px}
.lang-seg button{padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-dim)}
.lang-seg button.on{background:var(--accent);color:var(--accent-ink)}
.tb-chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;background:var(--card);
  border:1px solid var(--border-soft);font-size:13px;font-weight:500;color:var(--text-dim)}
.tb-chip:hover{color:var(--text)}
.tb-icon{position:relative;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--border-soft);color:var(--text-dim)}
.tb-icon:hover{color:var(--text)}
.tb-icon .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:99px;background:#e06a52;border:2px solid var(--bg)}
.tb-user{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;padding-left:4px}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:22px 26px 0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.page-head p{color:var(--text-dim);font-size:13.5px;margin-top:3px}
.head-clock{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:14px;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--border-soft);padding:9px 14px;border-radius:10px}

.searchbar{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:0 15px;height:48px;margin-bottom:16px}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14.5px}
.searchbar input::placeholder{color:var(--text-dim)}
.search-clear{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text-dim)}
.search-clear:hover{background:var(--field);color:var(--text)}

.cats{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.cat-chip{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;background:var(--card);
  border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--text-dim);transition:.14s}
.cat-chip:hover{color:var(--text);border-color:var(--border)}
.cat-chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cat-count{font-size:11px;font-weight:700;background:rgba(0,0,0,.18);border-radius:99px;min-width:19px;height:19px;
  display:grid;place-items:center;padding:0 5px}
.cat-chip:not(.on) .cat-count{background:var(--field);color:var(--text-faint)}

.grid-wrap{flex:1;overflow-y:auto;padding-bottom:24px;margin:0 -6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:16px;padding:2px 6px}
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:13px}

/* ---------- Product card ---------- */
.card{text-align:left;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--r);
  overflow:hidden;transition:.16s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.card:active{transform:translateY(-1px)}
.card-img{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.grid.compact .card-img{aspect-ratio:5/4}
.card-emblem{display:flex;flex-direction:column;align-items:center;gap:7px}
.emblem-word{font-size:12px;font-weight:600;letter-spacing:.06em;color:oklch(0.82 0.02 95 / .6);font-style:italic}
.cat-tag{position:absolute;left:11px;bottom:11px;font-size:9.5px;font-weight:700;letter-spacing:.1em;
  color:oklch(0.86 0.02 95 / .55)}
.hot{position:absolute;right:11px;top:11px;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#fff;
  background:color-mix(in srgb,var(--accent) 88%,#000);padding:4px 8px;border-radius:7px}
.card-foot{padding:12px 14px 13px}
.card-name{font-size:14px;font-weight:600;line-height:1.3;text-wrap:pretty}
.grid.compact .card-name{font-size:13px}
.card-price{font-size:15px;font-weight:700;color:var(--accent);margin-top:5px;font-variant-numeric:tabular-nums}

.grid-empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0;color:var(--text-dim)}
.grid-empty p{font-size:15px}

/* ---------- Cart panel ---------- */
.cart{width:var(--cart-w);flex-shrink:0;background:var(--panel);border-left:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:20px 18px}
.cart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ch-title{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:700}
.ch-count{font-size:12px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);
  padding:4px 10px;border-radius:99px}

.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--border-soft);border-radius:11px;padding:4px;margin-bottom:13px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:8px;
  font-size:13.5px;font-weight:600;color:var(--text-dim);transition:.14s}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.field{display:flex;align-items:center;gap:10px;background:var(--field);border:1px solid var(--border-soft);
  border-radius:11px;padding:0 13px;height:46px;margin-bottom:11px;color:var(--text-dim);position:relative}
.field:focus-within{border-color:var(--accent)}
.field .select,.field .input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;height:100%}
.field .select{appearance:none;cursor:pointer}
.field .select:invalid,.field .select option[value=""]{color:var(--text-dim)}
.field-chev{position:absolute;right:13px;pointer-events:none;color:var(--text-dim)}
.field .input.bare::placeholder{color:var(--text-dim)}

.cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-faint)}
.cart-empty p{font-size:16px;font-weight:600;color:var(--text-dim);margin-top:8px}
.cart-empty span{font-size:13px}

.cart-list{flex:1;overflow-y:auto;margin:2px -6px 6px;padding:0 6px;display:flex;flex-direction:column;gap:9px}
.line{display:flex;gap:11px;background:var(--card);border:1px solid var(--border-soft);border-radius:12px;padding:11px}
.line-emblem{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid var(--border-soft)}
.line-info{flex:1;min-width:0}
.line-name{font-size:13.5px;font-weight:600;line-height:1.25}
.line-opt{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.3}
.line-note{font-size:11.5px;color:var(--accent);margin-top:2px;font-style:italic}
.line-price{font-size:13px;font-weight:700;color:var(--text);margin-top:5px;font-variant-numeric:tabular-nums}
.line-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.line-del{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text-faint)}
.line-del:hover{background:color-mix(in srgb,#e06a52 16%,transparent);color:#e06a52}
.qty{display:flex;align-items:center;gap:2px;background:var(--field);border:1px solid var(--border-soft);border-radius:9px;padding:2px}
.qty button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text-dim)}
.qty button:hover{background:var(--card-h);color:var(--text)}
.qty span{min-width:24px;text-align:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}

.totals{border-top:1px dashed var(--border);padding:14px 4px 4px;display:flex;flex-direction:column;gap:9px;margin-top:4px}
.trow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.trow.disc{color:var(--accent)}
.trow.grand{font-size:19px;font-weight:800;color:var(--text);margin-top:3px}
.trow.grand span:last-child{color:var(--accent)}

.sendbtn{margin-top:14px;height:56px;border-radius:13px;background:var(--accent);color:var(--accent-ink);
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;
  font-variant-numeric:tabular-nums;transition:.15s;box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.sendbtn:hover{filter:brightness(1.06)}
.sendbtn.disabled{background:var(--card);color:var(--text-faint);box-shadow:none;cursor:not-allowed}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.62);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:20px;
  animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(480px,100%);max-height:88vh;background:var(--panel);border:1px solid var(--border);border-radius:20px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:13px;padding:18px 18px 16px;border-bottom:1px solid var(--border-soft)}
.mh-emblem{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--accent) 13%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.mh-info{flex:1}
.mh-name{font-size:18px;font-weight:700}
.mh-base{font-size:14px;color:var(--text-dim);margin-top:2px;font-variant-numeric:tabular-nums}
.mh-close{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-dim);border:1px solid var(--border-soft)}
.mh-close:hover{background:var(--card);color:var(--text)}
.modal-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.no-opts{display:flex;align-items:center;gap:9px;color:var(--text-dim);font-size:14px;padding:6px 0}
.opt-group .opt-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:10px;letter-spacing:.01em}
.opt-choices{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:flex;align-items:center;gap:7px;padding:10px 15px;border-radius:11px;background:var(--card);
  border:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text);transition:.13s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent);color:var(--text)}
.chip.on{box-shadow:inset 0 0 0 1px var(--accent)}
.chip-add{font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.modal-body .input{width:100%;background:var(--field);border:1px solid var(--border);border-radius:11px;
  padding:12px 14px;color:var(--text);font-size:14px;outline:none}
.modal-body .input:focus{border-color:var(--accent)}
.modal-body .input::placeholder{color:var(--text-dim)}
.modal-foot{display:flex;align-items:center;gap:13px;padding:16px 18px;border-top:1px solid var(--border-soft)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px}
.stepper button{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--text-dim)}
.stepper button:hover{background:var(--field);color:var(--text)}
.stepper span{min-width:36px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.add-btn{flex:1;height:50px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-size:15.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;font-variant-numeric:tabular-nums}
.add-btn:hover{filter:brightness(1.06)}

/* ---------- Toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--accent) 92%,#000);color:#fff;padding:13px 20px;border-radius:13px;font-size:14.5px;
  font-weight:600;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);animation:toastin .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toastin{from{transform:translateX(-50%) translateY(14px);opacity:0}to{transform:translateX(-50%);opacity:1}}

@media(max-width:1180px){
  :root{--cart-w:340px;--sb-w:228px}
}

/* ---------- Tables (Bàn ăn) ---------- */
.main.tables{padding-bottom:0}
.floor-stats{display:flex;gap:18px;align-items:center;font-size:13.5px;color:var(--text-dim)}
.floor-stats b{font-weight:800;font-size:16px;color:var(--text);margin-right:3px;font-variant-numeric:tabular-nums}
.tables-wrap{flex:1;overflow-y:auto;padding-bottom:24px;margin:0 -6px}
.zone{padding:0 6px;margin-bottom:22px}
.zone-title{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;
  margin:4px 2px 12px;display:flex;align-items:center;gap:10px}
.zone-title::after{content:"";flex:1;height:1px;background:var(--border-soft)}
.tbl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.tbl-card{--st:var(--text-dim);text-align:left;background:var(--card);border:1px solid var(--border-soft);
  border-radius:var(--r);padding:15px 16px 14px;display:flex;flex-direction:column;gap:12px;min-height:148px;
  transition:.16s;position:relative;overflow:hidden}
.tbl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st);opacity:.9}
.tbl-card:hover{transform:translateY(-3px);border-color:var(--st);box-shadow:var(--shadow)}
.tbl-card.empty{border-style:dashed;background:transparent}
.tbl-card.serving{background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.tbl-card.bill{background:color-mix(in srgb,#e0795a 11%,var(--card))}
.tbl-top{display:flex;align-items:center;justify-content:space-between}
.tbl-name{font-size:21px;font-weight:800;letter-spacing:.01em}
.tbl-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--st)}
.tbl-badge .dot{width:8px;height:8px;border-radius:99px;background:var(--st)}
.tbl-card.bill .tbl-badge .dot,.tbl-card.serving .tbl-badge .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st) 60%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.tbl-mid{flex:1;display:flex;flex-direction:column;gap:6px}
.tbl-mid.empty{justify-content:center;color:var(--text-faint)}
.tbl-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
.chairs{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-dim)}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-soft);padding-top:11px}
.tbl-bill{font-size:16px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.tbl-cta{font-size:13px;font-weight:700;color:var(--st)}
.tbl-cta.warn{color:#e0795a}
.tbl-card.empty .tbl-cta{color:var(--accent)}
.tbl-card.empty .tbl-foot{border-top-color:transparent;padding-top:0;margin-top:auto}

/* ---------- Stub ---------- */
.main.stub{display:grid;place-items:center}
.stub-card{text-align:center;max-width:420px;padding:40px}
.stub-emblem{width:96px;height:96px;border-radius:26px;margin:0 auto 22px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.stub-card h2{font-size:26px;font-weight:800;margin-bottom:12px}
.stub-card p{color:var(--text-dim);font-size:14.5px;line-height:1.6}
.stub-tag{margin-top:22px;display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-faint);
  border:1px solid var(--border-soft);padding:7px 14px;border-radius:99px;text-transform:uppercase}
</style>
</head>
