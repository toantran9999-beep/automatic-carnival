# ⚠️ File này là BẢN COPY để dán vào GitHub web (token git hiện thiếu quyền
# `workflow` nên không push thẳng vào .github/workflows/ được).
#
# Cách thêm: GitHub repo → tab Actions → "New workflow" → "set up a workflow
# yourself" → đặt tên file `build-apk.yml` → dán toàn bộ nội dung dưới → Commit.
# (Hoặc thêm quyền `workflow` cho Personal Access Token rồi báo mình push hộ.)

name: Build POS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pos-android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: pos-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toda-pos-quay-apk
          path: pos-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
