plugins {
    id 'com.android.application'
}

// Ký bằng khoá cố định để CÀI ĐÈ được, khỏi phải gỡ app rồi dựng lại cấu hình
// mỗi lần cập nhật. Xem lý do đầy đủ trong signing.gradle.
apply from: "$rootDir/signing.gradle"

android {
    namespace 'vn.toda.bankbridge'
    compileSdk 34

    defaultConfig {
        applicationId "vn.toda.bankbridge"
        minSdk 21
        targetSdk 34
        // ⚠️ TĂNG mỗi lần sửa APK. Điện thoại khai số này về máy chủ qua nhịp thở
        // và nó hiện ở Cài đặt → Chi nhánh — quên tăng là mất luôn cách duy nhất
        // biết máy đang chạy bản nào.
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
