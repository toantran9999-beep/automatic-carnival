name: Build POS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pos-android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Khoá ký cố định cho APK cầu nối, để CÀI ĐÈ được thay vì phải gỡ app rồi
      # dựng lại toàn bộ cấu hình mỗi lần cập nhật. Xem pos-android/signing.gradle.
      #
      # Giải mã ra $RUNNER_TEMP — NGOÀI thư mục checkout, nên không đường nào lọt
      # vào artifact hay release.
      #
      # Chưa thêm secret thì bỏ qua và build như cũ: CI không được gãy chỉ vì
      # thiếu một thứ chưa kịp cấu hình.
      - name: Giai ma keystore (bo qua neu chua co secret)
        env:
          KS_B64: ${{ secrets.TODA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Chua co secret TODA_KEYSTORE_BASE64 -> dung khoa debug ngau nhien nhu truoc"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/toda.p12"
          echo "TODA_KEYSTORE_PATH=$RUNNER_TEMP/toda.p12" >> "$GITHUB_ENV"
          echo "Da giai ma keystore"

      - name: Build debug APK
        working-directory: pos-android
        env:
          TODA_KEYSTORE_PASSWORD: ${{ secrets.TODA_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      # Vân tay chứng chỉ là thông tin CÔNG KHAI, in ra an toàn — và đây là cách
      # duy nhất để đối chiếu hai lần build có cùng khoá hay không. Hai lần chạy
      # ra vân tay khác nhau = vẫn đang ký bằng khoá ngẫu nhiên, cài đè sẽ hỏng.
      - name: In van tay chung chi APK cau noi
        run: |
          APK=pos-android/bankbridge/build/outputs/apk/debug/bankbridge-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256' || true
          else
            keytool -printcert -jarfile "$APK" | grep -i 'SHA256' || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toda-pos-quay-apk
          path: pos-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # APK thứ hai: cầu thông báo ngân hàng, cài trên ĐIỆN THOẠI CHỦ QUÁN
      # (không phải máy quầy). `gradle assembleDebug` ở trên build cả hai module.
      - name: Upload Bank Bridge APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toda-bank-bridge-apk
          path: pos-android/bankbridge/build/outputs/apk/debug/bankbridge-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pos-apk-latest
          name: TODA POS — APK mới nhất
          body: |
            - `app-debug.apk` — **TODA POS Quầy**: máy POS ở quầy, in USB Gprinter.
            - `bankbridge-debug.apk` — **TODA Bank Bridge**: cài trên ĐIỆN THOẠI CHỦ QUÁN,
              đọc thông báo app ngân hàng để đơn tự chốt và bàn tự dọn.
              Hướng dẫn: `pos-android/bankbridge/README.md`.
          files: |
            pos-android/app/build/outputs/apk/debug/app-debug.apk
            pos-android/bankbridge/build/outputs/apk/debug/bankbridge-debug.apk
          fail_on_unmatched_files: true
